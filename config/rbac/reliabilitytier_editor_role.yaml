# This rule is not used by the project reliabilitytier-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the platform.platform.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: reliabilitytier-operator
    app.kubernetes.io/managed-by: kustomize
  name: reliabilitytier-editor-role
rules:
- apiGroups:
  - platform.platform.example.com
  resources:
  - reliabilitytiers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.platform.example.com
  resources:
  - reliabilitytiers/status
  verbs:
  - get
